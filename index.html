<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <!-- <script src="js/script.js" defer></script> -->
    <title>Document</title>
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">
        <div class="row" id="header-bar">
            <div class="col">
                <h1 class="title">My Interactive Dashboard</h1>
                <p class="title">This dashboard was created by Aaron Hunter for the WEB-115 course at Wake Tech</p>
                <script>document.write('<p class="script-text">This dashboard demonstrates how JavaScript can be used to create interactive websites.</p>');</script>
                <!-- The <noscript> is for web browsers with JavaScript rendering disabled. -->
                <noscript>Unfortunately, your web browser does not support JavaScript.</noscript>
            </div>
    </div>
    <div class="container">
        <div class="row">
            <!-- Dashboard Content -->
             <div class="col" id="weekly-tasks">
                <!-- Weekly tasks go here -->
                <script src="js/task-manager.js" defer></script>
                <div>
                <h2 class="heading">Weekly Task Tracker</h2>
                </div>
                <form>
                    <div>
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name">
                    </div>

                    <div>
                    <label for="daily_task_goal">Daily Task Goal:</label>
                    <input type="number" id="daily_task_goal" name="daily_task_goal" min="0">
                    </div>

                    <div>
                    <label for="weekly_bonus_tasks">Weekly Bonus Tasks:</label>
                    <input type="number" id="weekly_bonus_tasks" name="weekly_bonus_tasks" min="0">
                    </div>
                    <button type="button" id="goal-btn" class="btn btn-primary">Set Goal</button>
                </form>
                <p id="goal-message"></p>
             </div> 
             <div class="col" id="metric-converter">
                <!-- Metric and Imperial Converter-->
                <script src="js/metric-converter.js" defer></script>
                <div>
                <h2 class="heading">Metric Converter</h2>
                </div>
                <form>
                    <div>
                    <label for="numeric-value">Value to Convert:</label>
                    <input type="number" id="numeric-value" name="numeric-value" min="0">
                    </div>
                    <div>
                    <label for="conversion-type">What to Convert:</label>
                    <select id="conversion-type" name="conversion-type">
                        <option value="Inch to Centimeter">Inch to Centimeter</option>
                        <option value="Centimeter to Inch">Centimeter to Inch</option>
                        <option value="Foot to Centimeter">Foot to Centimeter</option>
                        <option value="Centimeter to Foot">Centimeter to Foot</option>
                        <option value="Yard to Meter">Yard to Meter</option>
                        <option value="Meter to Yard">Meter to Yard</option>
                        <option value="Mile to Kilometer">Mile to Kilometer</option>
                        <option value="Kilometer to Mile">Kilometer to Mile</option>
                    </select>
                    </div>
                    <div>
                    <button type="button" id="convert-btn" class="btn btn-primary">Convert</button>
                    </div>
                </form>
                <p id="conversion-result"></p>
             </div> 
             <div class="col" id="magic-eight-ball">
                <script src="/js/magic-eight-ball.js" defer></script>
                <link rel="stylesheet" href="css/magic-eight-ball.css">
                <h2 class="heading">Magic Eight Ball</h2>
                <form>
                <p id="instructions">Type a yes/no question below, then click on the Eight Ball below to get your answer!</p>
                <input id="question" name="question" size="80">
                <div id="magicEightBall">
                    <div id="circle">
                        <p id="magic-answer"></p>
                    </div>
                    <img id="ball" src="img/magic-eight-ball.png"/>
                </div>
                <button id="reset" name="reset" type="reset" class="btn btn-primary">Ask another question</button>
                <input id="new-answer" name="new-answer" size="80">
                <button id="add-answer" name="add-answer" type="button" class="btn btn-primary">Add New Answer</button>
                </form>
                <br>
            </div> 
        </div>
    </div>
</body>
</html>
